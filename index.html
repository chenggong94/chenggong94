<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的专属聊天</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    height: 100vh; /* 强制占满屏幕高度 */
    display: flex;
    flex-direction: column;
    overflow: hidden; /* 禁止整个页面滚动 */
  }

  /* 1. 顶部导航栏（固定） */
  .header {
    height: 56px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 17px;
    color: #333;
    border-bottom: 1px solid #e5e7eb;
    z-index: 10;
  }

  /* 2. 聊天记录区域（可滚动） */
  .chat-area {
    flex: 1; /* 占据中间所有剩余空间 */
    overflow-y: auto; /* 允许上下滚动 */
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 消息气泡（沿用之前的美化） */
  .msg-row { display: flex; align-items: flex-start; width: 100%; }
  .msg-row.left { justify-content: flex-start; }
  .msg-row.right { justify-content: flex-end; }

  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ccc; overflow: hidden; flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-row.left .avatar { margin-right: 10px; }
  .msg-row.right .avatar { margin-left: 10px; }

  .bubble {
    max-width: 75%;
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .msg-row.left .bubble { background: #ffffff; color: #333; border-radius: 0px 18px 18px 18px; }
  .msg-row.right .bubble { background: #5b6ef5; color: #ffffff; border-radius: 18px 0px 18px 18px; }
  
  /* 图片网格 */
  .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-top: 8px; border-radius: 8px; overflow: hidden; max-width: 220px; }
  .gallery-grid img { width: 100%; height: 100px; object-fit: cover; cursor: pointer; }
  .single-img { width: 100%; max-width: 200px; border-radius: 8px; margin-top: 8px; display: block; }

  /* 3. 底部输入框（固定） */
  .input-area {
    height: 60px;
    background: #ffffff;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    border-top: 1px solid #e5e7eb;
    z-index: 10;
  }
  .input-area input {
    flex: 1;
    height: 40px;
    border: 1px solid #d1d5db;
    border-radius: 20px;
    padding: 0 16px;
    font-size: 15px;
    outline: none;
    background: #f9fafb;
  }
  .input-area input:focus { border-color: #5b6ef5; background: #fff; }
  .input-area button {
    width: 40px; height: 40px;
    border: none;
    border-radius: 50%;
    background: #5b6ef5;
    color: white;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .input-area button:active { transform: scale(0.95); }
</style>
</head>
<body>

  <!-- 顶部栏 -->
  <div class="header">和猫猫૭的聊天</div>

  <!-- 聊天内容区（滚动） -->
  <div class="chat-area">
    
    <div class="msg-row left">
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=cat" alt="猫猫"></div>
      <div class="bubble">
        <div>猫猫，我今天又实现了规划里的小目标！</div>
        <img class="single-img" src="https://imagetourl.im/api/storage/file?key=anon%2F-%2F8208589618697-721e2364-a913-4f72-baa3-8a2427d59aa7-19992.jpg" alt="19992" />" alt="阅读照片">
      </div>
    </div>

    <div class="msg-row right">
      <div class="bubble">揉揉兔头</div>
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=me" alt="兔兔"></div>
    </div>

    <div class="msg-row left">
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=cat" alt="猫猫"></div>
      <div class="bubble">
        <div>我还拍了其他照片，你看看！</div>
        <div class="gallery-grid">
          <img src="https://picsum.photos/id/1016/300/300">
          <img src="https://picsum.photos/id/1018/300/300">
          <img src="https://picsum.photos/id/1019/300/300">
          <img src="https://picsum.photos/id/1021/300/300">
        </div>
      </div>
    </div>

  </div>

  <!-- 底部输入框（目前只是外观，还不能真正打字发送） -->
  <div class="input-area">
    <button style="background: transparent; color: #666; font-size: 24px;">+</button>
    <input type="text" placeholder="输入消息..." disabled>
    <button>↑</button>
  </div>

</body>
</html>
