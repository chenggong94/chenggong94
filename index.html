<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>猫窝 - 房间聊天</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    /* 这里换成你想要的深色木纹背景，可以用网络图片 */
    background-color: #1a1a1a;
    background-image: url('https://images.unsplash.com/photo-1551269901-5c5e14c25df7?q=80&w=1000&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #fff;
  }

  /* 顶部导航栏（半透明毛玻璃） */
  .header {
    height: 56px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    z-index: 10;
  }

  /* 音乐悬浮播放器（在聊天区域上方） */
  .music-dock {
    padding: 8px 16px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(5px);
  }
  .music-dock audio { width: 100%; height: 36px; opacity: 0.9; }

  /* 聊天内容区 */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 系统通知（比如 xxx 进入房间） */
  .system-msg {
    text-align: center;
    font-size: 12px;
    color: #ccc;
    background: rgba(255, 255, 255, 0.1);
    padding: 4px 12px;
    border-radius: 12px;
    align-self: center;
    backdrop-filter: blur(4px);
  }

  /* 消息行 */
  .msg-row { display: flex; align-items: flex-start; gap: 10px; }
  .msg-row.right { flex-direction: row-reverse; }
  
  /* 头像（增加圆角和边框） */
  .avatar { width: 42px; height: 42px; border-radius: 8px; overflow: hidden; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  /* 消息主体 */
  .msg-body { max-width: 75%; display: flex; flex-direction: column; gap: 4px; }
  .msg-row.right .msg-body { align-items: flex-end; }

  /* 名字与标签（截图里的“咩咩镁”和性别符号） */
  .user-info { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
  .tag { background: rgba(255,255,255,0.2); padding: 1px 6px; border-radius: 4px; font-size: 10px; color: #fff; }

  /* 气泡 */
  .bubble {
    background: rgba(255, 255, 255, 0.9);
    color: #333;
    padding: 10px 14px;
    border-radius: 0 12px 12px 12px;
    font-size: 15px;
    line-height: 1.5;
    word-wrap: break-word;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  /* 自己的气泡（右侧，深红色调，参考截图） */
  .msg-row.right .bubble {
    background: rgba(139, 27, 56, 0.9);
    color: #fff;
    border-radius: 12px 0 12px 12px;
  }

  /* 艾特（@）样式 */
  .at-user { color: #5b6ef5; font-weight: bold; }
  .msg-row.right .at-user { color: #ff9eb5; }

  /* 气泡里的图片 */
  .bubble img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }

  /* 底部输入框（半透明） */
  .input-area {
    height: 60px;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
  }
  .input-area input {
    flex: 1; height: 40px;
    border: none; border-radius: 20px;
    padding: 0 16px; font-size: 15px; outline: none;
    background: rgba(255, 255, 255, 0.15); color: #fff;
  }
  .input-area input::placeholder { color: #aaa; }
  .input-area button {
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: #5b6ef5; color: white; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

  <div class="header">箱庭</div>
  
  <div class="music-dock">
    <!-- 这里的 src 换成你喜欢的音乐链接，或者你上传到 GitHub 的音频文件 -->
    <audio controls>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="chat-area">
    <!-- 系统进出通知 -->
    <div class="system-msg">“北方花火” 加入了房间</div>
    <div class="system-msg">“祭筱心” 加入了房间</div>

    <!-- 别人的消息 -->
    <div class="msg-row left">
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=cat" alt="头像"></div>
      <div class="msg-body">
        <div class="user-info">
          <span>祭筱心</span>
          <span class="tag">⭐</span>
        </div>
        <div class="bubble">
          <span class="at-user">@北方花火</span> 我在。
        </div>
      </div>
    </div>

    <!-- 你自己的消息 -->
    <div class="msg-row right">
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=me" alt="头像"></div>
      <div class="msg-body">
        <div class="user-info">
          <span>你在个锤子。</span>
          <span class="tag">秘密</span>
        </div>
        <div class="bubble">
          看看我拍的极光！
          <img src="https://picsum.photos/id/1021/400/300" alt="极光">
        </div>
      </div>
    </div>

    <!-- 带图片的别人消息 -->
    <div class="msg-row left">
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=star" alt="头像"></div>
      <div class="msg-body">
        <div class="user-info">
          <span>夜疏星</span>
        </div>
        <div class="bubble">
          欢迎新人！
          <img src="https://picsum.photos/id/1018/400/300" alt="照片">
        </div>
      </div>
    </div>

  </div>

  <!-- 底部输入框 -->
  <div class="input-area">
    <button style="background: transparent; color: #aaa; font-size: 24px;">+</button>
    <input type="text" placeholder="说点什么...">
    <button>↑</button>
  </div>

</body>
</html>
