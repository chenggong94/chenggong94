<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静态页面还原</title>
<style>
    /* 全局重置 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #333; display: flex; justify-content: center; padding: 20px; }

    /* 手机模拟器容器 */
    .phone-screen {
        width: 375px;
        height: 812px;
        background-color: #f0f0f0;
        border-radius: 40px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        border: 8px solid #111;
    }

    /* 隐藏滚动条 */
    .phone-screen::-webkit-scrollbar { display: none; }

    /* ================= 页面1：房间推荐 ================= */
    .page-1 {
        height: 100%;
        overflow-y: auto;
        background: linear-gradient(135deg, #e6e9e5, #d8dbd7);
        padding-bottom: 20px;
    }

    .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
        background: rgba(255,255,255,0.8);
        backdrop-filter: blur(5px);
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .header-left, .header-right { display: flex; align-items: center; font-weight: bold; color: #444; }
    .header-icon { font-size: 18px; margin-right: 5px; }
    .header-title { font-size: 16px; margin-left: 5px; }

    .section-title {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 30px;
        margin-bottom: 20px;
        color: #666;
        font-size: 16px;
        font-weight: bold;
    }
    .section-title span { margin-right: 5px; font-size: 18px; }

    .room-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        padding: 0 20px;
    }

    .room-card {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .room-img-container {
        position: relative;
        width: 100%;
        aspect-ratio: 4/3;
        background-color: #ddd;
    }
    /* 模拟图片 */
    .room-img-1 { background: linear-gradient(to bottom right, #fce4ec, #f8bbd0); }
    .room-img-2 { background: linear-gradient(to bottom right, #1a1a2e, #16213e); }

    .temp-badge {
        position: absolute;
        bottom: 5px;
        right: 5px;
        background: rgba(0,0,0,0.5);
        color: #fff;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
    }

    .room-info { padding: 10px; }
    .room-name { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 5px; }
    .room-desc {
        font-size: 12px;
        color: #888;
        line-height: 1.4;
        height: 34px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        margin-bottom: 8px;
    }
    .room-players { text-align: right; font-size: 12px; color: #666; }

    /* ================= 页面2：底部抽屉（弹窗） ================= */
    .page-2-overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        z-index: 20;
    }

    .bottom-sheet {
        background: #fff;
        border-radius: 20px 20px 0 0;
        overflow: hidden;
        max-height: 85%;
        display: flex;
        flex-direction: column;
    }

    .sheet-banner {
        height: 180px;
        background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
        position: relative;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        color: #fff;
    }
    .sheet-banner h2 { font-size: 20px; margin-bottom: 5px; }
    .sheet-banner p { font-size: 10px; opacity: 0.8; margin-bottom: 5px; line-height: 1.3; }
    .banner-tags { display: flex; gap: 10px; font-size: 11px; }

    .avatar-list {
        display: flex;
        padding: 15px 20px;
        overflow-x: auto;
        gap: 15px;
        border-bottom: 1px solid #eee;
    }
    .avatar-list::-webkit-scrollbar { display: none; }
    .avatar-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-shrink: 0;
    }
    .avatar-circle {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: #ccc;
        margin-bottom: 5px;
        border: 2px solid #fff;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .avatar-name { font-size: 10px; color: #666; }

    .action-list { padding: 10px 0; }
    .action-item {
        display: flex;
        align-items: center;
        padding: 15px 20px;
        font-size: 15px;
        color: #333;
        cursor: pointer;
    }
    .action-item:active { background: #f5f5f5; }
    .action-icon {
        width: 20px; height: 20px;
        margin-right: 15px;
        background: #666;
        mask-size: cover;
        -webkit-mask-size: cover;
        border-radius: 4px;
    }
    /* 简单用色块代替图标 */
    .icon-enter { background-color: #888; }
    .icon-folder { background-color: #aaa; }
    .icon-info { background-color: #ccc; }

    /* ================= 页面3：详情页 ================= */
    .page-3 {
        height: 100%;
        background: #111 url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
        position: relative;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 30px 20px;
    }
    .page-3::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.9));
    }
    .detail-content { position: relative; z-index: 2; }
    .detail-content h1 { font-size: 32px; margin-bottom: 5px; font-weight: 800; }
    .detail-content .author { font-size: 14px; color: #aaa; margin-bottom: 20px; }
    .detail-content .desc { font-size: 13px; line-height: 1.6; color: #ddd; margin-bottom: 40px; }
    
    .loading-bar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        font-size: 12px;
        color: #aaa;
    }
    .loading-bar span { margin-right: 10px; }
    .progress-bg {
        width: 60px; height: 4px;
        background: rgba(255,255,255,0.3);
        border-radius: 2px;
        overflow: hidden;
    }
    .progress-fill {
        width: 40%; height: 100%;
        background: #fff;
        border-radius: 2px;
    }

    /* ================= 页面4：聊天界面 ================= */
    .page-4 {
        height: 100%;
        background-color: #1a1a1a;
        background-image: url('https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'); /* 模拟木纹 */
        background-size: cover;
        background-position: center;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    .chat-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .chat-container::-webkit-scrollbar { display: none; }

    .msg-row { display: flex; width: 100%; }
    .msg-left { justify-content: flex-start; }
    .msg-right { justify-content: flex-end; }

    .chat-avatar {
        width: 36px; height: 36px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        background: #ccc;
        margin-right: 10px;
    }
    .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .msg-bubble {
        max-width: 70%;
        padding: 10px 15px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.4;
        position: relative;
        word-wrap: break-word;
    }
    .bubble-left {
        background: #333; /* 在深色背景上稍微亮一点 */
        color: #fff;
        border-top-left-radius: 4px;
    }
    .bubble-system {
        background: rgba(255,255,255,0.1);
        color: #aaa;
        font-size: 12px;
        text-align: center;
        padding: 5px 10px;
        border-radius: 4px;
        margin: 0 auto;
    }

    .sticker {
        width: 120px;
        height: auto;
        border-radius: 8px;
        background: #e0e0e0;
        padding: 10px;
        text-align: center;
        font-size: 12px;
        color: #666;
    }

    .chat-input-bar {
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(10px);
        padding: 15px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .chat-input {
        flex: 1;
        background: rgba(255,255,255,0.1);
        border: none;
        border-radius: 20px;
        padding: 10px 15px;
        color: #fff;
        font-size: 14px;
        outline: none;
    }
    .chat-input::placeholder { color: #888; }
    .add-btn {
        width: 30px; height: 30px;
        border-radius: 50%;
        background: rgba(255,255,255,0.2);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        cursor: pointer;
    }

    /* 页面切换控制按钮（用于演示） */
    .nav-controls {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 100;
    }
    .nav-btn {
        background: rgba(255,255,255,0.7);
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
        color: #333;
    }
</st
