<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的对话框</title>
<style>
  body { background-color: #f3f4f6; font-family: sans-serif; padding: 20px; }
  .chat-container { max-width: 500px; margin: 0 auto; }
  /* 左侧消息 */
  .msg-left { display: flex; margin-bottom: 20px; }
  .msg-left .avatar { width: 40px; height: 40px; border-radius: 5px; background: #ccc; margin-right: 10px; }
  .msg-left .bubble { background: white; padding: 12px; border-radius: 0 10px 10px 10px; max-width: 70%; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .msg-left img { width: 100%; border-radius: 5px; margin-top: 10px; }
  /* 右侧消息 */
  .msg-right { display: flex; justify-content: flex-end; margin-bottom: 20px; }
  .msg-right .avatar { width: 40px; height: 40px; border-radius: 5px; background: #ccc; margin-left: 10px; }
  .msg-right .bubble { background: #4f46e5; color: white; padding: 12px; border-radius: 10px 0 10px 10px; max-width: 70%; }
</style>
</head>
<body>

<div class="chat-container">
  <!-- 左侧：兔兔发的消息带图 -->
  <div class="msg-left">
    <div class="avatar"><!-- 这里可以换成你的头像 img --></div>
    <div class="bubble">
      猫猫，我今天又实现了规划里的小目标！
      <!-- 把下面的 src 换成你的图片链接 -->
      <img src="https://via.placeholder.com/300x200" alt="阅读照片">
    </div>
  </div>

  <!-- 右侧：猫猫的回复 -->
  <div class="msg-right">
    <div class="bubble">
      太棒了！恭喜兔兔迈出人生的一大步！
    </div>
    <div class="avatar"><!-- 这里可以换成你的头像 img --></div>
  </div>
</div>

</body>
</html>
