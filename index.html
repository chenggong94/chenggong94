<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的专属聊天 + 音乐</title>

<!-- ===== 1. quikchat 样式 ===== -->
<link rel="stylesheet" href="https://unpkg.com/quikchat/dist/quikchat.css" />

<!-- ===== 2. quikchat 脚本 ===== -->
<script src="https://unpkg.com/quikchat"></script>

<!-- ===== 3. WPWebPlayer 样式与脚本 ===== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/wpwebplayer@1.1.5/min-css.css">
<script src="https://cdn.jsdelivr.net/npm/wpwebplayer@1.1.5/min-js.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100dvh;
    height: 100vh;
  }

  /* 顶部标题栏 */
  .header {
    height: 52px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 17px;
    color: #333;
    border-bottom: 1px solid #e5e7eb;
    z-index: 10;
    padding-top: env(safe-area-inset-top);
    flex-shrink: 0;
  }

  /* 聊天区容器 —— quikchat 会自动填充它 */
  #chatContainer {
    flex: 1;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }

  /* 底部音乐播放器区域 */
  .music-bar {
    flex-shrink: 0;
    padding: 6px 12px;
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
    background: #ffffff;
    border-top: 1px solid #e5e7eb;
    z-index: 10;
  }
</style>
</head>
<body>

  <div class="header">和猫猫૭的聊天</div>

  <!-- 聊天区域：quikchat 会接管这个容器 -->
  <div id="chatContainer"></div>

  <!-- 底部音乐播放器：使用 WPWebPlayer 自定义标签 -->
  <div class="music-bar">
    <wp-music-player
      src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      title="背景音乐"
      artist="我的歌单"
      cover="https://picsum.photos/id/1015/200/200"
      autoplay="false"
      loop="true"
      volume="0.3"
      fixed="false"
      mini="true"
      theme="#5b6ef5">
    </wp-music-player>
  </div>

<script>
  // ========== 1. 初始化 quikchat 聊天组件 ==========
  const chat = new quikchat('#chatContainer', async (chat, userMessage) => {
    // 用户发消息后，显示在自己的右侧
    chat.messageAddNew(userMessage, 'me', 'right', 'user');

    // 模拟对方回复（延迟 800ms）
    const typingId = chat.messageAddTypingIndicator('猫猫');
    setTimeout(() => {
      chat.messageRemove(typingId); // 移除输入指示器
      chat.messageAddNew('收到啦！(๑•̀ㅂ•́)و✧', '猫猫', 'left', 'assistant');
    }, 800);
  }, {
    theme: 'quikchat-theme-light',
    trackHistory: true,
    titleArea: {
      title: '和猫猫૭的聊天',
      show: false        // 顶部已有 header，这里隐藏 title
    },
    showTimestamps: true,
    sanitize: true
  });

  // ========== 2. 预设初始聊天记录（相册网格 + 图片） ==========
  // 注意：quikchat 默认将内容作为文本处理。
  // 如果需要显示图片，可利用 sanitize:false 插入自定义 HTML。
  // 下面演示插入一条带图片的消息：
  chat.messageAddNew(
    '<div>猫猫，我今天又实现了规划里的小目标！</div>' +
    '<img src="https://imagetourl.im/api/storage/file?key=anon%2F-%2F8208589618697-721e2364-a913-4f72-baa3-8a2427d59aa7-19992.jpg" style="max-width:200px;border-radius:8px;margin-top:8px;display:block;" />',
    '兔兔',
    'left',
    'user'
  );

  chat.messageAddNew('揉揉兔头', '猫猫', 'right', 'assistant');

  chat.messageAddNew(
    '<div>我还拍了其他照片，你看看！</div>' +
    '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:4px;margin-top:8px;max-width:220px;">' +
      '<img src="https://picsum.photos/id/1016/300/300" style="width:100%;height:100px;object-fit:cover;border-radius:4px;" />' +
      '<img src="https://picsum.photos/id/1018/300/300" style="width:100%;height:100px;object-fit:cover;border-radius:4px;" />' +
      '<img src="https://picsum.photos/id/1019/300/300" style="width:100%;height:100px;object-fit:cover;border-radius:4px;" />' +
      '<img src="https://picsum.photos/id/1021/300/300" style="width:100%;height:100px;object-fit:cover;border-radius:4px;" />' +
    '</div>',
    '兔兔',
    'left',
    'user'
  );
</script>

</body>
</html>
