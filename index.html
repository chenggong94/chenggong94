<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天相册列表</title>
<style>
  body { font-family: sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
  .chat-container { width: 100%; max-width: 450px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; }
  .chat-header { padding: 15px; background: #4a76a8; color: white; font-weight: bold; text-align: center; }
  .chat-body { padding: 15px; height: 500px; overflow-y: auto; background: #e5e5e5; }
  .msg-row { display: flex; margin-bottom: 15px; }
  .msg-row.right { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 10px; border-radius: 10px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
  .msg-row.right .bubble { background: #dcf8c6; }
  .text { font-size: 15px; margin-bottom: 8px; }
  /* 相册网格核心样式 */
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 5px; border-radius: 8px; overflow: hidden; }
  .gallery-grid img { width: 100%; height: 100px; object-fit: cover; cursor: pointer; display: block; }
  .gallery-grid img:hover { opacity: 0.9; }
  /* 灯箱效果 */
  .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
  .lightbox.active { display: flex; }
  .lightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; }
</style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">📸 旅行相册</div>
  <div class="chat-body">
    <div class="msg-row right">
      <div class="bubble">
        <div class="text">这次去海边拍了好多照片！</div>
        <!-- 相册网格 -->
        <div class="gallery-grid">
          <img src="https://picsum.photos/id/1015/400/400" onclick="openLightbox(this.src)">
          <img src="https://picsum.photos/id/1016/400/400" onclick="openLightbox(this.src)">
          <img src="https://picsum.photos/id/1018/400/400" onclick="openLightbox(this.src)">
          <img src="https://picsum.photos/id/1019/400/400" onclick="openLightbox(this.src)">
          <img src="https://picsum.photos/id/1021/400/400" onclick="openLightbox(this.src)">
        </div>
      </div>
    </div>
    <div class="msg-row">
      <div class="bubble">
        <div class="text">太美了！这是在哪里？</div>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="">
</div>

<script>
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('active');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }
</script>
</body>
</html>
