<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 关键1：添加 viewport-fit=cover，让网页延伸至全面屏底部 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的专属聊天</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* 关键2：使用 dvh 动态视口高度，代替旧的 100vh */
  html, body {
    height: 100%;
  }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f4f6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100dvh; /* 移动端新标准，动态计算高度 */
    height: 100vh;  /* 兜底，老设备不支持 dvh 时用这个 */
  }

  .header {
    height: 56px; background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 17px; color: #333;
    border-bottom: 1px solid #e5e7eb; z-index: 10;
    padding-top: env(safe-area-inset-top); /* 适配刘海屏顶部 */
  }

  .chat-area {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 16px;
    padding-bottom: 20px; /* 留出点底部空间，防止内容紧贴输入框 */
  }

  .msg-row { display: flex; align-items: flex-start; width: 100%; }
  .msg-row.left { justify-content: flex-start; }
  .msg-row.right { justify-content: flex-end; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ccc; overflow: hidden; flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-row.left .avatar { margin-right: 10px; }
  .msg-row.right .avatar { margin-left: 10px; }
  .bubble {
    max-width: 75%; padding: 12px 16px; font-size: 15px; line-height: 1.5;
    word-wrap: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .msg-row.left .bubble { background: #ffffff; color: #333; border-radius: 0px 18px 18px 18px; }
  .msg-row.right .bubble { background: #5b6ef5; color: #ffffff; border-radius: 18px 0px 18px 18px; }
  
  .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-top: 8px; border-radius: 8px; overflow: hidden; max-width: 220px; }
  .gallery-grid img { width: 100%; height: 100px; object-fit: cover; cursor: pointer; }
  .single-img { width: 100%; max-width: 200px; border-radius: 8px; margin-top: 8px; display: block; cursor: pointer; }

  /* 关键3：给底部输入框增加安全距离，防止被手机底部横条遮挡 */
  .input-area {
    background: #ffffff; display: flex; align-items: center;
    padding: 10px 12px; 
    padding-bottom: calc(10px + env(safe-area-inset-bottom)); /* 适配 iPhone 底部小黑条 */
    gap: 8px; border-top: 1px solid #e5e7eb; z-index: 10;
  }
  .input-area input {
    flex: 1; height: 40px; border: 1px solid #d1d5db; border-radius: 20px;
    padding: 0 16px; font-size: 15px; outline: none; background: #f9fafb;
  }
  .input-area input:focus { border-color: #5b6ef5; background: #fff; }
  .input-area button {
    width: 40px; height: 40px; border: none; border-radius: 50%;
    background: #5b6ef5; color: white; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: 0.2s;
  }
  .input-area button:active { transform: scale(0.95); }
  
  /* 图片预览弹窗 */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    z-index: 999; justify-content: center; align-items: center; cursor: pointer;
  }
  .overlay.active { display: flex; }
  .overlay img { max-width: 90%; max-height: 90%; border-radius: 8px; }
</style>
</head>
<body>

  <div class="header">和猫猫૭的聊天</div>

  <div class="chat-area" id="chatArea">
    <!-- 初始聊天记录 -->
    <div class="msg-row left">
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=cat" alt="猫猫"></div>
      <div class="bubble">
        <div>猫猫，我今天又实现了规划里的小目标！</div>
        <!-- 提示：记得换成你自己的图片链接哦！ -->
        <img class="single-img" src="https://imagetourl.im/api/storage/file?key=anon%2F-%2F8208589618697-721e2364-a913-4f72-baa3-8a2427d59aa7-19992.jpg" onclick="openImg(this.src)">
      </div>
    </div>

    <div class="msg-row right">
      <div class="bubble">揉揉兔头</div>
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=me" alt="兔兔"></div>
    </div>

    <div class="msg-row left">
      <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=cat" alt="猫猫"></div>
      <div class="bubble">
        <div>我还拍了其他照片，你看看！</div>
        <div class="gallery-grid">
          <img src="https://picsum.photos/id/1016/300/300" onclick="openImg(this.src)">
          <img src="https://picsum.photos/id/1018/300/300" onclick="openImg(this.src)">
          <img src="https://picsum.photos/id/1019/300/300" onclick="openImg(this.src)">
          <img src="https://picsum.photos/id/1021/300/300" onclick="openImg(this.src)">
        </div>
      </div>
    </div>
  </div>

  <!-- 底部输入区 -->
  <div class="input-area">
    <input type="file" id="fileInput" accept="image/*" style="display: none;">
    <button style="background: transparent; color: #666; font-size: 24px;" onclick="document.getElementById('fileInput').click()">+</button>
    <input type="text" id="msgInput" placeholder="输入消息...">
    <button onclick="sendMessage()">↑</button>
  </div>

  <div class="overlay" id="overlay" onclick="this.classList.remove('active')">
    <img id="overlayImg" src="">
  </div>

<script>
  const chatArea = document.getElementById('chatArea');
  const msgInput = document.getElementById('msgInput');
  const fileInput = document.getElementById('fileInput');

  // 发送文字消息
  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    const myMsgHTML = `
      <div class="msg-row right">
        <div class="bubble">${text}</div>
        <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=me" alt="兔兔"></div>
      </div>
    `;
    chatArea.insertAdjacentHTML('beforeend', myMsgHTML);
    msgInput.value = '';
    chatArea.scrollTop = chatArea.scrollHeight;

    // 模拟自动回复
    setTimeout(() => {
      const replyHTML = `
        <div class="msg-row left">
          <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=cat" alt="猫猫"></div>
          <div class="bubble">收到啦！(๑•̀ㅂ•́)و✧</div>
        </div>
      `;
      chatArea.insertAdjacentHTML('beforeend', replyHTML);
      chatArea.scrollTop = chatArea.scrollHeight;
    }, 800);
  }

  // 发送本地图片
  fileInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const imgHTML = `
        <div class="msg-row right">
          <div class="bubble">
            <img class="single-img" src="${event.target.result}" onclick="openImg(this.src)">
          </div>
          <div class="avatar"><img src="https://api.dicebear.com/7.x/thumbs/svg?seed=me" alt="兔兔"></div>
        </div>
      `;
      chatArea.insertAdjacentHTML('beforeend', imgHTML);
      chatArea.scrollTop = chatArea.scrollHeight;
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  // 图片放大预览
  function openImg(src) {
    document.getElementById('overlayImg').src = src;
    document.getElementById('overlay').classList.add('active');
  }

  // 回车发送
  msgInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
</script>

</body>
</html>
